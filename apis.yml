aid: datarails
name: Datarails
description: >-
  Datarails is an Excel-native financial planning and analysis (FP&A) platform
  for the office of the CFO, marketed as FinanceOS. It consolidates data from
  ERP, CRM, HRIS, billing and operational systems into a single finance data
  model, then lets finance teams budget, forecast, consolidate, report and build
  dashboards while continuing to work in Excel through the Datarails Flex
  add-in. Its API surface is deliberately narrow and unusually agent-first: the
  primary programmatic interface is a hosted Model Context Protocol server at
  mcp.datarails.com, secured with OAuth 2.1 and PKCE, exposing roughly two dozen
  read-only tools for discovering data models, profiling fields, running
  filtered queries and asynchronous aggregations, and extracting validated
  financials into Excel. Datarails also ships a first-party Claude Code plugin
  carrying nineteen published Agent Skills, plus connectors for ChatGPT,
  Microsoft 365 Copilot and Lovable. The only documented conventional REST
  operation is the Data Gateway Service file-upload endpoint used to push CSV
  and Excel files into a Filebox.
