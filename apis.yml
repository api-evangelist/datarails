apis:
- aid: datarails:data-gateway-service
  name: Datarails Data Gateway Service (DGS)
  description: >-
    REST file-upload endpoint used to push a CSV or Excel file into a Datarails Filebox. Authenticated
    with HTTP Basic using a base64-encoded Datarails sync user (which must not have MFA enabled). The
    target Filebox must have "Upload via API" enabled and the caller supplies its UUID along with the
    file, version name and version tags. Documented in prose only; Datarails publishes no OpenAPI for
    this surface.
  humanURL: >-
    https://support.datarails.com/hc/en-us/articles/14616773038620-Data-Gateway-Service-DGS-API-Documentation
  baseURL: https://app.datarails.com/api/v1
  tags:
