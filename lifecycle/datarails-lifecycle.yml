description: >-
  Versioning, deprecation and operational-transparency posture across the
  Datarails API surfaces. Datarails runs a genuine deprecation practice on its
  MCP tool surface — retired tool names are kept callable and published with an
  old -> new mapping — but it does not publish a written deprecation policy,
  a sunset-header contract or an SLA.

