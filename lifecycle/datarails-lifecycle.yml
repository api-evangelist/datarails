    current: 3.0.0
    source: openapi/datarails-financeos-mcp-openapi.json
  mcp_plugin:
    scheme: semver in .claude-plugin/plugin.json
    current: 3.0.6
    released: '2026-07-13'
    source: https://github.com/Datarails/dr-claude-code-plugins-re
  dgs_rest:
    scheme: uri-path
    current: v1
    example: https://app.datarails.com/api/v1/fileboxes/upload_file
    source: https://support.datarails.com/hc/en-us/articles/14616773038620-Data-Gateway-Service-DGS-API-Documentation
  breaking_change_practice: >-
    The v3.0.0 tool consolidation (2026-06-23) renamed or removed a large part
    of the tool surface. Datarails shipped a published old -> new mapping table
    and instructs clients to map retired names silently rather than report them
    as missing.

