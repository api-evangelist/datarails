removed_tools:
- name: profile_table_summary
  reason: Removed in v3.0.0; replaced by profile_numeric_fields + profile_categorical_fields.
- name: detect_anomalies
  reason: Removed in v3.0.0; anomaly findings are computed client-side from profile_* plus aggregates.
- name: execute_query
  reason: Removed in v3.0.0; superseded by get_data_by_* advanced filters (or gated sql_query).
- name: list_metrics_by_category
  reason: Removed; filter the list_business_metrics result client-side.
- name: list_metrics_by_dimension
  reason: Removed; filter the list_business_metrics result client-side.
- name: get_metric_dimension_matrix
  reason: Removed; derive client-side from list_business_metrics.
capabilities:
  read_only: true
  read_only_evidence: '"Can ChatGPT modify my data in Datarails? No. The MCP connection is read-only.
    ChatGPT can query and analyze your data but cannot create, update, or delete any records in Datarails."
    — support.datarails.com/hc/en-us/articles/25905041804444'
  permission_model: Server-side enforcement of the caller's existing Datarails permissions; a user sees
    only data they are authorised to access in the tenant.
  data_replication: none (only data required for a specific request is transmitted)
limits:
  filtered_row_fetch: 500 rows per page (get_data_by_*)
  custom_query_rows: 1000
  aggregation_rows: unlimited
  serialized_result_cap: ~100 KB, after which the response carries a truncation envelope {data, truncated,
    total_rows, returned_rows, guidance}
  token_expiry: JWT expires in 5 minutes; auto-refreshed for aggregation, manual refresh every 20K rows
    for pagination
  observed_rate_limit_header: 'x-ratelimit-limit: 120'
  see: rate-limits/datarails-rate-limits.yml
