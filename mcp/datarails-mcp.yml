tool_surface_note: Two published tool surfaces exist and they disagree. The support article (updated 2026-05-04)
  documents the pre-3.0 tool names; the plugin repository CHANGELOG records that the MCP server consolidated
  its tool surface in v3.0.0 (2026-06-23) and again in v3.0.5 (2026-07-12, async start-poll migration).
  The current names below are taken from the plugin, which is the newer of the two; the retired names
  are preserved as aliases because Datarails documents that the server still maps them.
tools:
- name: list_data_models
  category: discovery
  description: Entry point for both raw data layers. Lists available finance tables / data models; each
    entry carries the numeric id (for the by-id tools) and the alias (for the by-alias tools; empty when
    a table has no alias).
  gated: false
  aliases_retired:
  - list_finance_tables
- name: list_aliased_fields
  category: discovery
  description: Lists the aliased (friendly-named) fields of a table. Preferred raw-data entry point —
    roughly 95% fewer tokens than the by-id layer. A table alias does not imply its fields are aliased.
  gated: false
  aliases_retired:
  - list_semantic_tables
  - get_semantic_table_schema
- name: get_fields_by_id
  category: discovery
  description: Returns column names, types and relationships for a table by numeric id.
  gated: false
  aliases_retired:
  - get_table_schema
- name: list_business_metrics
  category: discovery
  description: Lists the org's named business metrics (KPI catalog). Ungated, so it is the discovery entry
    point for the business-metrics layer even where the metric-data tools are feature-flag denied.
  gated: false
  aliases_retired:
  - get_metric_definitions
- name: profile_numeric_fields
  category: profiling
  description: Baseline numeric statistics (SUM/AVG/MIN/MAX/COUNT) per field, relayed in the backend-native
    DR_Values / col_keys / row_keys layout.
  gated: false
- name: profile_categorical_fields
  category: profiling
  description: Category frequencies and cardinality. Must be given an explicit business-dimension field
    list, or it profiles upload/mapping metadata columns rather than business data.
  gated: false
- name: get_data_by_alias
  category: query
  description: Retrieve filtered rows from an aliased table (max 500 rows per page).
  gated: false
  aliases_retired:
  - get_records_by_filter
  - get_sample_records
  - semantic_query
- name: get_data_by_id
  category: query
  description: Retrieve filtered rows from a table by numeric field ids (max 500 rows per page).
  gated: false
  aliases_retired:
  - get_records_by_filter
  - get_sample_records
- name: start_aggregation_by_alias
  category: aggregation
  description: 'Start a grouped aggregation over an aliased table. Non-blocking; returns {status: pending,
    handle}. No row limit on the result.'
  gated: false
- name: get_aggregation_result_by_alias
  category: aggregation
  description: Poll for the result of start_aggregation_by_alias. status "running" plus retry_after_seconds
    means poll again; it is not an error.
  gated: false
- name: start_aggregation_by_id
  category: aggregation
  description: Start a grouped aggregation over a table addressed by numeric field ids.
  gated: false
- name: get_aggregation_result_by_id
  category: aggregation
  description: Poll for the result of start_aggregation_by_id.
  gated: false
- name: get_aggregated_data_by_alias
  category: aggregation
  description: Blocking aggregation over an aliased table.
  gated: false
  deprecated: true
  superseded_by:
  - start_aggregation_by_alias
  - get_aggregation_result_by_alias
  note: Hidden from the tool list since v3.1 but still callable.
  aliases_retired:
  - aggregate_table_data
  - semantic_aggregate
- name: get_aggregated_data_by_id
  category: aggregation
  description: Blocking aggregation over a table by numeric field ids.
  gated: false
  deprecated: true
  superseded_by:
  - start_aggregation_by_id
  - get_aggregation_result_by_id
  aliases_retired:
  - aggregate_table_data
- name: start_distinct_values_by_alias
  category: discovery
  description: Start a distinct-values fetch for an aliased field. Non-blocking.
  gated: false
- name: get_distinct_values_result_by_alias
  category: discovery
  description: Poll for distinct values started by start_distinct_values_by_alias; takes the limit argument.
  gated: false
- name: start_distinct_values_by_id
  category: discovery
  description: Start a distinct-values fetch for a field addressed by numeric id.
  gated: false
- name: get_distinct_values_result_by_id
  category: discovery
  description: Poll for distinct values started by start_distinct_values_by_id.
  gated: false
- name: get_distinct_values_by_alias
  category: discovery
  description: Blocking distinct-values fetch for an aliased field.
  gated: false
  deprecated: true
  superseded_by:
  - start_distinct_values_by_alias
  - get_distinct_values_result_by_alias
  aliases_retired:
  - get_field_distinct_values
  - semantic_distinct_values
- name: get_distinct_values_by_id
  category: discovery
  description: Blocking distinct-values fetch for a field by numeric id.
  gated: false
  deprecated: true
  superseded_by:
  - start_distinct_values_by_id
  - get_distinct_values_result_by_id
  aliases_retired:
