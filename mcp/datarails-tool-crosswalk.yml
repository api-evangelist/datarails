source: mcp/datarails-mcp.yml + openapi/datarails-financeos-mcp-openapi.json + skills/_index.yml
description: >-
  Crosswalk between the Datarails FinanceOS MCP tool surface and the public
  OpenAPI at mcp.datarails.com/openapi.json. The honest finding is that they
  barely overlap: the published OpenAPI describes only the MCP server's own
  infrastructure and OAuth plumbing (health, readiness, discovery, callback),
  while every data capability is exposed exclusively as an MCP tool over
  JSON-RPC at POST /mcp. There is no public REST projection of the FinanceOS
  data model, so nearly every tool is mcp_only by construction. That is a real
  surface divergence, recorded rather than papered over.

surfaces:
