    version: OpenAPI 3.1.0
    title: Datarails Finance OS MCP Server
    api_version: 3.0.0
    operations: 5
    gated: false
    note: >-
      Anonymous, unauthenticated document. Describes operational and OAuth
      endpoints only; declares no securitySchemes and no servers[].
  mcp:
    url: https://mcp.datarails.com/mcp
    transport: streamable-http
    gated: true
    gate: OAuth 2.1 bearer; anonymous tools/list returns 401 invalid_token
    tool_source: >-
      Datarails' published FinanceOS MCP support article plus the allowed-tools
      frontmatter of its 19 first-party Agent Skills. Input schemas are NOT
      available anonymously.
  graphql:
    present: false
    note: No GraphQL surface found on any Datarails host.
  rest_data_api:
    present: partial
    endpoint: https://app.datarails.com/api/v1/fileboxes/upload_file
    note: >-
      The one documented non-MCP REST operation (Data Gateway Service file
      upload, HTTP Basic auth, multipart form-data). It is documented in prose
      only — Datarails publishes no OpenAPI for it — so it is captured in
      apis.yml and conventions/ rather than as a spec operation.

