generated: '2026-08-01'
method: searched
source: npm registry, PyPI, RubyGems, crates.io, and the Datarails GitHub organization
description: >-
  Datarails publishes NO API client SDK in any language. What it does publish
  is first-party npm packages for its own front-end (charts, icons, shared
  components) and a first-party Claude Code plugin that packages the FinanceOS
  MCP connector plus 19 Agent Skills. The plugin is the closest thing Datarails
  ships to an official client, and it is distributed through GitHub rather than
  a language package registry.

