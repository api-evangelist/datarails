api_client_sdks: []
api_client_sdk_note: >-
  No official or community client library exists for either the FinanceOS MCP
  server or the Data Gateway Service upload endpoint. MCP clients speak the
  protocol directly; DGS callers are told to use Postman or hand-rolled HTTP.

